plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ecolytics'
version = '0.0.1-SNAPSHOT'
description = 'ecolytics'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

def frontendDir = layout.projectDirectory.dir('frontend')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
    workingDir frontendDir
    commandLine npmCommand, 'ci'
    inputs.file(frontendDir.file('package.json'))
    inputs.file(frontendDir.file('package-lock.json'))
    outputs.dir(frontendDir.dir('node_modules'))
}

tasks.register('buildFrontend', Exec) {
    dependsOn 'npmInstall'
    workingDir frontendDir
    commandLine npmCommand, 'run', 'build'
    inputs.dir(frontendDir.dir('src'))
    inputs.dir(frontendDir.dir('public'))
    inputs.file(frontendDir.file('index.html'))
    inputs.file(frontendDir.file('vite.config.js'))
    outputs.dir(frontendDir.dir('dist'))
}

tasks.named('processResources') {
    dependsOn 'buildFrontend'
    from(frontendDir.dir('dist')) {
        into 'static'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
