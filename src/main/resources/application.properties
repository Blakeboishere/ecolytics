spring.application.name=ecolytics
# Local persistent database for the project; the database files are kept in ./data.
spring.datasource.url=jdbc:h2:file:./data/ecolytics;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# Hibernate (through Spring Data JPA) creates and updates tables from @Entity classes.
spring.jpa.hibernate.ddl-auto=update
# Handy for inspecting user_accounts and remnant_entries during a local project demo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 10-second window for the requested local expiry test; set FOOD_DONATION_WINDOW=PT8H for the real workflow.
ecolytics.food-donation-window=${FOOD_DONATION_WINDOW:PT5M}
ecolytics.food-expiry-check-interval-ms=1000
